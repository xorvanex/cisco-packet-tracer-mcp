[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-packet-tracer-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Cisco Packet Tracer Network Topology Generation and Automation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ingeniería de Sistemas - NetDevOps" }
]
keywords = ["mcp", "cisco", "packet-tracer", "networking", "vlsm", "ios", "netdevops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "packet-tracer-pkt-format>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
cisco-pt-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
